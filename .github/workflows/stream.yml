name: KAXMOK Separate 24/7 Live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: kaxmok-24-7live-yt-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start YouTube stream
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: python3 stream.py
