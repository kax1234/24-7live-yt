name: KAXMOK Separate 24/7 Live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: kaxmok-24-7live-yt-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y nodejs npm

      - name: Install chat reader
        run: npm install youtubei.js

      - name: Start analytics and YouTube stream
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          YT_VIDEO_ID: "XVF4AhsrUqM"
          ANALYTICS_URL: "https://kaxmok-analytics.kaxxmok.workers.dev"
          ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
        run: |
          python3 analytics.py &
          ANALYTICS_PID=$!
          trap 'kill "$ANALYTICS_PID" 2>/dev/null || true' EXIT
          python3 stream.py
